<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiTracker - Dog Epilepsy Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>EpiTracker</h1>
      <p>Track and manage your dog's epilepsy journey</p>
    </div>

    <!-- Login Form -->
    <div id="login-section" class="auth-form">
      <h2>Log In</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="error-msg" hidden></div>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
    </div>

    <!-- Signup Form -->
    <div id="signup-section" class="auth-form" hidden>
      <h2>Create Account</h2>
      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">First Name</label>
          <input type="text" id="signup-name" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required minlength="8" autocomplete="new-password">
          <span class="hint">At least 8 characters</span>
        </div>
        <div id="signup-error" class="error-msg" hidden></div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="#" id="show-login">Log in</a></p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
